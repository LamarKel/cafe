<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu — Atalia Café</title>
    <meta name="description"
        content="Explore Atalia Café's full menu — hot coffee, cold drinks, matcha, bakery, sandwiches and more.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        /* ── Lang toggle ── */
        .lang-toggle {
            background: transparent;
            border: 1.5px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: .8rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all .25s ease;
            letter-spacing: .04em;
        }

        .lang-toggle:hover {
            background: var(--primary-color);
            color: #fff;
        }

        /* ── Cart badge ── */
        .nav-cart {
            position: relative;
            display: flex;
            align-items: center;
        }

        .nav-cart .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--secondary-color);
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 700;
        }

        /* ── Search bar ── */
        .menu-search-wrap {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-color);
            background: var(--light-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .menu-search {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-color);
            border: 1.5px solid var(--border-color);
            border-radius: 999px;
            padding: 10px 18px;
            transition: border-color .2s;
        }

        .menu-search:focus-within {
            border-color: var(--primary-color);
        }

        .menu-search i {
            color: var(--text-light);
            font-size: .9rem;
        }

        .menu-search input {
            border: none;
            background: none;
            outline: none;
            font-family: var(--font-body);
            font-size: .95rem;
            color: var(--dark-color);
            flex: 1;
        }

        .menu-search input::placeholder {
            color: var(--text-light);
        }

        .search-clear {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: .85rem;
            padding: 0;
            display: none;
        }

        .search-clear.show {
            display: block;
        }

        /* ── Store selector modal ── */
        .store-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .store-modal.active {
            display: flex;
        }

        .store-modal-box {
            background: var(--light-color);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
            animation: slideUp .35s ease;
        }

        .store-modal-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--dark-color);
            margin-bottom: 6px;
        }

        .store-modal-sub {
            color: var(--text-light);
            font-size: .9rem;
            margin-bottom: var(--space-lg);
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .store-item {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all .2s;
        }

        .store-item:hover {
            border-color: var(--primary-color);
            background: rgba(107, 127, 90, .04);
        }

        .store-item.selected {
            border-color: var(--primary-color);
            background: rgba(107, 127, 90, .06);
        }

        .store-item-icon {
            width: 40px;
            height: 40px;
            background: rgba(107, 127, 90, .1);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .store-item-name {
            font-weight: 600;
            font-size: .95rem;
        }

        .store-item-addr {
            font-size: .8rem;
            color: var(--text-light);
        }

        .store-item-check {
            margin-left: auto;
            color: var(--primary-color);
            font-size: 1.1rem;
            display: none;
        }

        .store-item.selected .store-item-check {
            display: block;
        }

        /* ── Nutritional info pills ── */
        .nutrition-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .nutrition-pill {
            background: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 3px 10px;
            font-size: .75rem;
            color: var(--text-light);
        }

        .nutrition-pill strong {
            color: var(--dark-color);
        }

        /* ── Sold out overlay ── */
        .product-image-compact.sold-out::after {
            content: 'Sold out';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: .05em;
        }

        /* ── Product modal footer ── */
        .modal-product-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--light-color);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-add-btn {
            flex: 1;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 14px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all .25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-add-btn:hover {
            background: var(--secondary-color);
        }

        .modal-add-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .modal-total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--secondary-color);
            white-space: nowrap;
        }

        /* ── Toast ── */
        #toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--dark-color);
            color: #fff;
            padding: 12px 22px;
            border-radius: 999px;
            font-size: .875rem;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
            animation: toastIn .3s ease both;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .toast.success {
            background: var(--primary-color);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ── Empty search state ── */
        .search-empty {
            text-align: center;
            padding: var(--space-xxl) var(--space-lg);
            color: var(--text-light);
        }

        .search-empty i {
            font-size: 2.5rem;
            margin-bottom: var(--space-md);
            display: block;
            opacity: .4;
        }

        /* ── Skeleton cards ── */
        .product-card-skeleton {
            background: var(--light-color);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .sk-img {
            width: 100%;
            padding-bottom: 100%;
            background: #f0f0f0;
        }

        .sk-line {
            height: 12px;
            border-radius: 4px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin: 8px;
        }

        .sk-line.short {
            width: 60%;
        }

        @keyframes shimmer {
            to {
                background-position-x: -200%;
            }
        }

        /* ── Customization section ── */
        .customization-section {
            margin: 16px 0;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .customization-section:last-of-type {
            border-bottom: none;
        }

        .customization-title {
            font-size: .95rem;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .customization-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .customization-option {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 500;
            background: none;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all .2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .customization-option small {
            font-size: .7rem;
            color: var(--text-light);
        }

        .customization-option:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .customization-option.selected {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #fff;
        }

        .customization-option.selected small {
            color: rgba(255, 255, 255, .8);
        }

        /* ── Quantity selector ── */
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }

        .quantity-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            background: none;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            font-family: var(--font-body);
        }

        .quantity-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .quantity-display {
            font-size: 1.1rem;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
        }
    </style>
</head>

    <!-- ═══════════════════════════════════════
     SCRIPTS
═══════════════════════════════════════ -->
    <script type="module">
        import {
            sb, getSettings, getCurrentLang,
            formatPrice, addToCart, updateCartBadge,
            sanitize, sanitizeInput
        } from './js/supabase.js';
        import { initI18n, t } from './js/i18n.js';

        // ── Init ──────────────────────────────────
        initI18n();
        updateCartBadge();

        const settings = await getSettings();
        let categories = [];
        let products = {};   // { [categoryId]: Product[] }
        let selectedStore = JSON.parse(localStorage.getItem('atalia_store') || 'null');
        let currentProduct = null;
        let currentQty = 1;
        let selectedSize = null;
        let selectedExtras = [];
        let searchQuery = '';

        window.openStoreModal = function () {
            document.getElementById('storeModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        };
        window.closeStoreModal = function () {
            document.getElementById('storeModal').classList.remove('active');
            document.body.style.overflow = '';
        };

        // ── Load data ────────────────────────────
        await Promise.all([loadCategories(), loadStores()]);

        // ── Load categories & products ───────────
        async function loadCategories() {
            const lang = getCurrentLang();
            const { data: cats } = await sb
                .from('categories')
                .select('*')
                .eq('active', true)
                .order('sort_order');

            if (!cats?.length) {
                document.getElementById('categoriesContainer').innerHTML =
                    `<div class="search-empty"><i class="fas fa-coffee"></i><p>No categories available yet.</p></div>`;
                return;
            }

            categories = cats;

            // Build sidebar
            buildSidebar(cats, lang);

            // Load all products for all categories
            const catIds = cats.map(c => c.id);
            const { data: prods } = await sb
                .from('products')
                .select('*, product_sizes(*), product_extras(*), product_nutritional_info(*), product_images(image_url, is_primary)')
                .in('category_id', catIds)
                .eq('active', true)
                .order('sort_order');

            // Group by category
            cats.forEach(c => { products[c.id] = []; });
            (prods || []).forEach(p => {
                if (products[p.category_id]) products[p.category_id].push(p);
            });

            // Build categories HTML
            buildCategoriesHTML(cats, lang);

            // Activate first
            if (cats[0]) activateCategory(cats[0].id);
        }

        // ── Sidebar ──────────────────────────────
        function buildSidebar(cats, lang) {
            const groups = {};
            cats.forEach(c => {
                const g = c.group_name || 'Menu';
                if (!groups[g]) groups[g] = [];
                groups[g].push(c);
            });

            const list = document.getElementById('sidebarList');
            list.innerHTML = Object.entries(groups).map(([group, items]) => `
    <div class="sidebar-section">
      <div class="sidebar-title">${sanitize(group)}</div>
      <ul class="sidebar-list">
        ${items.map(c => `
          <li>
            <a href="#cat-${sanitize(c.id)}"
               class="sidebar-link"
               data-cat="${sanitize(c.id)}"
               onclick="onSidebarClick(event,'${sanitize(c.id)}')">
              <i class="${sanitize(c.icon || 'fas fa-circle')}" aria-hidden="true"></i>
              ${sanitize(lang === 'es' && c.name_es ? c.name_es : c.name_en)}
            </a>
          </li>`).join('')}
      </ul>
    </div>`
            ).join('');
        }

        // ── Categories HTML ───────────────────────
        function buildCategoriesHTML(cats, lang) {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = cats.map(c => {
                const catProducts = products[c.id] || [];
                const name = lang === 'es' && c.name_es ? c.name_es : c.name_en;
                const desc = lang === 'es' && c.description_es ? c.description_es : (c.description_en || '');

                return `
      <section class="menu-category" id="cat-${sanitize(c.id)}" data-cat="${sanitize(c.id)}">
        <div class="category-header">
          <h2 class="category-title">${sanitize(name)}</h2>
          ${desc ? `<p class="category-description">${sanitize(desc)}</p>` : ''}
        </div>
        <div class="category-grid" id="grid-${sanitize(c.id)}">
          ${catProducts.length
                        ? catProducts.map(p => buildProductCard(p, lang)).join('')
                        : `<p class="no-items-message" style="grid-column:1/-1;">${t('menu.no_products')}</p>`
                    }
        </div>
      </section>`;
            }).join('');

            // Wire add buttons (quick add without modal)
            container.querySelectorAll('.product-add-compact').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const catId = btn.dataset.cat;
                    const p = (products[catId] || []).find(x => x.id === id);
                    if (!p) return;

                    // If has sizes or extras → open modal
                    if (p.product_sizes?.length || p.product_extras?.length) {
                        openProductModal(p);
                        return;
                    }

                    // Direct add
                    quickAdd(p, btn);
                });
            });

            // Wire card clicks → modal
            container.querySelectorAll('.product-card-compact').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const catId = card.dataset.cat;
                    const p = (products[catId] || []).find(x => x.id === id);
                    if (p) openProductModal(p);
                });
            });

            // Scroll spy
            const mc = document.getElementById('menuContent');
            mc.addEventListener('scroll', () => {
                const mcTop = mc.getBoundingClientRect().top;
                const threshold = mc.clientHeight * 0.35;
                let current = null;
                container.querySelectorAll('.menu-category').forEach(sec => {
                    if (sec.getBoundingClientRect().top - mcTop < threshold) {
                        current = sec.dataset.cat;
                    }
                });
                if (current) activateCategory(current);
            }, { passive: true });
        }

        function buildProductCard(p, lang) {
            const name = sanitize(lang === 'es' && p.name_es ? p.name_es : p.name_en);
            const price = formatPrice(p.price, settings);
            const soldOut = p.stock_enabled && !p.in_stock;
            const img = p.product_images?.find(i => i.is_primary)?.image_url
                || p.product_images?.[0]?.image_url
                || p.image_url
                || null;

            return `
    <article class="product-card-compact"
             data-id="${sanitize(p.id)}"
             data-cat="${sanitize(p.category_id)}"
             role="button" tabindex="0"
             aria-label="View ${name}">
      <div class="product-image-compact ${soldOut ? 'sold-out' : ''}">
     ${img ? `<img src="${sanitize(img)}" alt="${name}" loading="lazy"
  onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--accent-color);\'>☕</div>'">`
                    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--accent-color);">☕</div>`}
        ${p.featured ? `<span class="product-badge-compact">⭐</span>` : ''}
      </div>
      <div class="product-content-compact">
        <h3 class="product-name-compact">${name}</h3>
        <div class="product-price-compact">${price}</div>
        <button
          class="product-add-compact"
          data-id="${sanitize(p.id)}"
          data-cat="${sanitize(p.category_id)}"
          ${soldOut ? 'disabled' : ''}
          aria-label="Add ${name}">
          ${soldOut ? t('menu.sold_out') : `<i class="fas fa-plus" aria-hidden="true"></i> ${t('menu.add')}`}
        </button>
      </div>
    </article>`;
        }

        // ── Quick add (no sizes/extras) ───────────
        function quickAdd(p, btn) {
            if (!selectedStore) {
                showToast(t('menu_page.select_store'), '');
                openStoreModal();
                return;
            }
            addToCart({
                id: p.id, name_en: p.name_en, name_es: p.name_es,
                price: p.price, image_url: p.image_url,
                category_id: p.category_id, size: null, extras: [], qty: 1,
            });
            updateCartBadge();
            const lang = getCurrentLang();
            const name = lang === 'es' && p.name_es ? p.name_es : p.name_en;
            showToast(`${sanitize(name)} ${t('menu.added')}`, 'success');
            btn.innerHTML = `<i class="fas fa-check"></i> ${t('menu.added')}`;
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = `<i class="fas fa-plus"></i> ${t('menu.add')}`;
                btn.disabled = false;
            }, 1200);
        }

        // ── Category activation ───────────────────
        function activateCategory(catId) {
            document.querySelectorAll('.sidebar-link').forEach(l =>
                l.classList.toggle('active', l.dataset.cat === catId));
        }

        window.onSidebarClick = function (e, catId) {
            e.preventDefault();
            activateCategory(catId);
            const sec = document.getElementById(`cat-${catId}`);
            sec?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Close mobile sidebar
            document.getElementById('menuSidebar').classList.remove('active');
        };


        // ── Search ────────────────────────────────
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        searchInput.addEventListener('input', () => {
            searchQuery = sanitizeInput(searchInput.value);
            searchClear.classList.toggle('show', searchQuery.length > 0);
            renderSearch();
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.classList.remove('show');
            renderSearch();
        });

        function renderSearch() {
            const lang = getCurrentLang();
            if (!searchQuery) {
                // Restore all categories
                document.querySelectorAll('.menu-category').forEach(s => {
                    s.style.display = '';
                    s.querySelectorAll('.product-card-compact').forEach(c => c.style.display = '');
                });
                document.getElementById('sidebarList').style.opacity = '1';
                return;
            }
            const q = searchQuery.toLowerCase();
            let hasResults = false;

            document.querySelectorAll('.menu-category').forEach(sec => {
                const catId = sec.dataset.cat;
                const catProds = products[catId] || [];
                let catHasResults = false;

                sec.querySelectorAll('.product-card-compact').forEach(card => {
                    const id = card.dataset.id;
                    const p = catProds.find(x => x.id === id);
                    if (!p) { card.style.display = 'none'; return; }
                    const name = (lang === 'es' && p.name_es ? p.name_es : p.name_en) || '';
                    const desc = (lang === 'es' && p.description_es ? p.description_es : (p.description_en || ''));
                    const match = name.toLowerCase().includes(q) || desc.toLowerCase().includes(q);
                    card.style.display = match ? '' : 'none';
                    if (match) { catHasResults = true; hasResults = true; }
                });

                sec.style.display = catHasResults ? '' : 'none';
            });

            if (!hasResults) {
                // Show empty state in first visible section
                document.querySelectorAll('.menu-category').forEach((s, i) => {
                    if (i === 0) {
                        s.style.display = '';
                        s.querySelector('.category-grid').innerHTML = `
          <div class="search-empty" style="grid-column:1/-1;">
            <i class="fas fa-search"></i>
            <p>${t('menu_page.no_results')}</p>
          </div>`;
                    }
                });
            }
        }


        // ── Product Modal ─────────────────────────
        window.openProductModal = function (p) {
            currentProduct = p;
            currentQty = 1;
            selectedSize = null;
            selectedExtras = [];

            const lang = getCurrentLang();
            const name = lang === 'es' && p.name_es ? p.name_es : p.name_en;
            const desc = lang === 'es' && p.description_es ? p.description_es : (p.description_en || '');
            const price = formatPrice(p.price, settings);

            const modalImg = p.product_images?.find(i => i.is_primary)?.image_url
                || p.product_images?.[0]?.image_url
                || p.image_url
                || 'images/hero.png';
            document.getElementById('modalProductImg').src = modalImg;
            document.getElementById('modalProductImg').alt = sanitize(name);
            document.getElementById('modalProductName').textContent = sanitize(name);
            document.getElementById('modalProductPrice').textContent = price;
            document.getElementById('modalProductDesc').textContent = sanitize(desc);

            // Nutrition
            const nutContainer = document.getElementById('modalNutrition');
            const info = p.product_nutritional_info || [];
            nutContainer.innerHTML = info.map(n => `
    <span class="nutrition-pill">
      <strong>${sanitize(lang === 'es' && n.label_es ? n.label_es : n.label_en)}:</strong>
      ${sanitize(n.value)}
    </span>`).join('');

            // Sizes
            const sizes = p.product_sizes?.filter(s => s.active) || [];
            const sizeSec = document.getElementById('sizesSection');
            if (sizes.length) {
                sizeSec.style.display = '';
                document.getElementById('sizesContainer').innerHTML = sizes.map((s, i) => `
      <button
        class="customization-option ${i === 0 ? 'selected' : ''}"
        data-size-id="${sanitize(s.id)}"
        data-price="${s.price_modifier || 0}"
        data-name="${sanitize(lang === 'es' && s.name_es ? s.name_es : s.name_en)}"
        onclick="selectSize(this)">
        ${sanitize(lang === 'es' && s.name_es ? s.name_es : s.name_en)}
        ${s.price_modifier > 0 ? `<small>+${formatPrice(s.price_modifier, settings)}</small>` : ''}
      </button>`).join('');
                // Default first size
                if (sizes[0]) {
                    selectedSize = { id: sizes[0].id, name: sizes[0].name_en, price: sizes[0].price_modifier || 0 };
                }
            } else {
                sizeSec.style.display = 'none';
            }

            // Extras
            const extras = p.product_extras?.filter(e => e.active) || [];
            const extraSec = document.getElementById('extrasSection');
            if (extras.length) {
                extraSec.style.display = '';
                document.getElementById('extrasContainer').innerHTML = extras.map(e => `
      <button
        class="customization-option"
        data-extra-id="${sanitize(e.id)}"
        data-price="${e.price || 0}"
        data-name="${sanitize(lang === 'es' && e.name_es ? e.name_es : e.name_en)}"
        onclick="toggleExtra(this)">
        ${sanitize(lang === 'es' && e.name_es ? e.name_es : e.name_en)}
        ${e.price > 0 ? `<small>+${formatPrice(e.price, settings)}</small>` : ''}
      </button>`).join('');
            } else {
                extraSec.style.display = 'none';
            }

            // Quantity
            document.getElementById('qtyDisplay').textContent = '1';
            updateModalTotal();

            // Open
            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeProductModal = function () {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = '';
        };

        window.selectSize = function (btn) {
            document.querySelectorAll('#sizesContainer .customization-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSize = {
                id: btn.dataset.sizeId,
                name: btn.dataset.name,
                price: parseFloat(btn.dataset.price) || 0,
            };
            updateModalTotal();
        };

        window.toggleExtra = function (btn) {
            btn.classList.toggle('selected');
            const id = btn.dataset.extraId;
            const name = btn.dataset.name;
            const price = parseFloat(btn.dataset.price) || 0;
            const idx = selectedExtras.findIndex(e => e.id === id);
            if (idx > -1) selectedExtras.splice(idx, 1);
            else selectedExtras.push({ id, name, price });
            updateModalTotal();
        };

        // Quantity buttons
        document.getElementById('qtyMinus').addEventListener('click', () => {
            currentQty = Math.max(1, currentQty - 1);
            document.getElementById('qtyDisplay').textContent = currentQty;
            updateModalTotal();
        });
        document.getElementById('qtyPlus').addEventListener('click', () => {
            currentQty = Math.min(20, currentQty + 1);
            document.getElementById('qtyDisplay').textContent = currentQty;
            updateModalTotal();
        });

        function updateModalTotal() {
            if (!currentProduct) return;
            const base = parseFloat(currentProduct.price) || 0;
            const sizeMod = selectedSize?.price || 0;
            const extrasMod = selectedExtras.reduce((s, e) => s + (e.price || 0), 0);
            const unit = base + sizeMod + extrasMod;
            const total = unit * currentQty;
            document.getElementById('modalTotal').textContent = formatPrice(total, settings);
        }

        // Add to cart from modal
        document.getElementById('modalAddBtn').addEventListener('click', () => {
            if (!currentProduct) return;
            if (!selectedStore) {
                showToast(t('menu_page.select_store'), '');
                closeProductModal();
                openStoreModal();
                return;
            }

            const lang = getCurrentLang();
            const base = parseFloat(currentProduct.price) || 0;
            const sizeMod = selectedSize?.price || 0;
            const extrasMod = selectedExtras.reduce((s, e) => s + (e.price || 0), 0);

            addToCart({
                id: currentProduct.id,
                name_en: currentProduct.name_en,
                name_es: currentProduct.name_es,
                price: base + sizeMod + extrasMod,
                image_url: currentProduct.image_url,
                category_id: currentProduct.category_id,
                size: selectedSize?.name || null,
                extras: selectedExtras,
                qty: currentQty,
            });

            updateCartBadge();
            closeProductModal();
            const name = lang === 'es' && currentProduct.name_es ? currentProduct.name_es : currentProduct.name_en;
            showToast(`${sanitize(name)} ${t('menu.added')}`, 'success');
        });

        // Close modal on backdrop click
        document.getElementById('productModal').addEventListener('click', e => {
            if (e.target === document.getElementById('productModal')) closeProductModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeProductModal();
        });

        // ── Stores ───────────────────────────────
        async function loadStores() {
            const { data: stores } = await sb
                .from('stores')
                .select('*, pickup_locations(*)')
                .eq('active', true)
                .order('created_at');

            const list = document.getElementById('storeList');
            if (!stores?.length) {
                list.innerHTML = `<p style="color:var(--text-light);text-align:center;padding:20px;">No stores available yet.</p>`;
                return;
            }

            list.innerHTML = stores.map(s => `
    <div class="store-item ${selectedStore?.id === s.id ? 'selected' : ''}"
         onclick="selectStore(${JSON.stringify(s).replace(/"/g, '&quot;')})">
      <div class="store-item-icon"><i class="fas fa-store"></i></div>
      <div>
        <div class="store-item-name">${sanitize(s.name)}</div>
        <div class="store-item-addr">
          ${[s.address, s.city, s.state].filter(Boolean).map(sanitize).join(', ')}
        </div>
      </div>
      <i class="fas fa-check store-item-check"></i>
    </div>`).join('');

            // Auto-open if no store selected
            if (!selectedStore) openStoreModal();
            else updateStoreBtnLabel();
        }

        window.selectStore = function (store) {
            selectedStore = store;
            localStorage.setItem('atalia_store', JSON.stringify(store));
            closeStoreModal();
            updateStoreBtnLabel();
            // Refresh store list UI
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('selected'));
            showToast(`Store: ${sanitize(store.name)}`, 'success');
        };

        document.getElementById('storeModal').addEventListener('click', e => {
            if (e.target === document.getElementById('storeModal')) closeStoreModal();
        });

        function updateStoreBtnLabel() {
            const lbl = document.getElementById('storeBtnLabel');
            const btn = document.getElementById('storeBtn');
            if (selectedStore) {
                lbl.textContent = selectedStore.name;
                btn.classList.add('selected');
            }
        }

        // ── Hamburger nav ────────────────────────
        document.getElementById('hamburger').addEventListener('click', () => {
            const nav = document.getElementById('nav-links');
            const open = nav.classList.toggle('active');
            document.getElementById('hamburger').setAttribute('aria-expanded', open);
        });

        // ── Mobile sidebar toggle ────────────────
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('menuSidebar');
        if (window.innerWidth <= 768) sidebarToggle.style.display = 'flex';

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });
        document.addEventListener('click', e => {
            if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });

        // ── Toast ────────────────────────────────
        function showToast(msg, type = '') {
            const c = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success'
                ? `<i class="fas fa-check-circle" aria-hidden="true"></i> ${sanitize(msg)}`
                : sanitize(msg);
            c.appendChild(toast);
            setTimeout(() => toast.remove(), 2600);
        }

        // ── Cart badge sync ──────────────────────
        window.addEventListener('atalia:cart-updated', updateCartBadge);
    </script>

</body>

</html>
