# ============================================================
#  ATALIA CAFÉ — netlify.toml
# ============================================================

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[dev]
  port      = 5500
  framework = "#static"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://js.stripe.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://esm.sh; frame-src https://js.stripe.com https://www.google.com;"

# Cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirects
[[redirects]]
  from   = "/menu"
  to     = "/menu.html"
  status = 200

[[redirects]]
  from   = "/cart"
  to     = "/cart.html"
  status = 200

[[redirects]]
  from   = "/checkout"
  to     = "/checkout.html"
  status = 200

[[redirects]]
  from   = "/track"
  to     = "/order-track.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404