# ============================================================
#  ATALIA CAFÉ — netlify.toml
#  Netlify configuration file
#  Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

# ── Build settings ───────────────────────────────────────────
# Pure static site — no build step needed
[build]
  publish = "."

# Netlify Functions directory (Phase 2 — Stripe integration)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Dev settings (local dev with `netlify dev`) ──────────────
[dev]
  command   = ""
  port      = 5500
  framework = "#static"

# ── Security headers (applied to all pages) ─────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Permissions policy — restrict unnecessary browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # Content Security Policy
    # Allows: Supabase, Google Fonts, FontAwesome, Stripe (Phase 2)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://cdn.jsdelivr.net
        https://js.stripe.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdnjs.cloudflare.com;
      font-src 'self'
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob: https:;
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://api.stripe.com;
      frame-src
        https://js.stripe.com
        https://www.google.com;
    """

# ── Cache: HTML pages ────────────────────────────────────────
# No cache for HTML — always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache: JavaScript ────────────────────────────────────────
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: CSS ───────────────────────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: Images ────────────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Cache: Fonts ─────────────────────────────────────────────
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ────────────────────────────────────────────────
# Clean URLs (optional)
[[redirects]]
  from   = "/menu"
  to     = "/menu.html"
  status = 200

[[redirects]]
  from   = "/cart"
  to     = "/cart.html"
  status = 200

[[redirects]]
  from   = "/checkout"
  to     = "/checkout.html"
  status = 200

[[redirects]]
  from   = "/track"
  to     = "/order-track.html"
  status = 200

# Admin — only accessible directly (no clean URL for security)
[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# 404 fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

# ── Environment variables hint ───────────────────────────────
# Set these in Netlify Dashboard → Site settings → Environment variables
# NEVER put secret keys in this file
#
# STRIPE_SECRET_KEY      = sk_live_...   ← Phase 2
# STRIPE_WEBHOOK_SECRET  = whsec_...     ← Phase 2